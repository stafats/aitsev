[project]
name = "aitsev"
version = "0.5.0"
description = "Aitsev core engine: multi-model AI pipeline for verified code, integration and data migration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Aitsev" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "cryptography>=43",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
]

[project.scripts]
aitsev-api = "aitsev.cli:run_api"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx2>=2.15",  # Starlette's TestClient transport
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitsev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "docker: tests that need a running Docker daemon",
    "live: tests that call real model providers (need API keys)",
]

[tool.coverage.run]
source = ["aitsev"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PL"]
ignore = [
    "PLR0913",  # many arguments are fine for service constructors
    "PLR2004",  # magic numbers in limits are documented in config
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "S603",     # subprocess use is intentional inside the sandbox runner
    "PLR0917",  # positional arguments in internal helpers are fine
    "ASYNC109", # explicit timeout parameters are part of the runner contract
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S607", "PLR2004", "ASYNC240"]
"migrations/**" = ["E501"]
"src/aitsev/integrations/codegen.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["aitsev"]
